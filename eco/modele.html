<style>
/* Thème de KTEC, teinte de PDRTEC */
:root {
  color-scheme: dark;
  --fond: #0a110d; --carte: #0f1813; --carte-2: #15211a; --carte-3: #1b2a21; --bord: #213328; --bord-fort: #2c4435;
  --texte: #e6f2ea; --texte-2: #a3c2ad; --texte-3: #6f8c79;
  --accent: #a3e635;
  --accent-doux: color-mix(in srgb, var(--accent) 12%, transparent);
  --accent-texte: color-mix(in srgb, var(--accent) 18%, #000);
  --rouge: #f05252; --rouge-doux: rgba(240, 82, 82, 0.12);
  --rayon: 12px; --ombre: 0 18px 50px rgba(0, 0, 0, 0.45);
  --police: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fond); color: var(--texte); font: 15px/1.5 var(--police); -webkit-font-smoothing: antialiased; padding: 32px 16px 48px; }
a { color: var(--accent); text-decoration: none; }
code { font-family: var(--mono); font-size: .9em; }
input, select, textarea { font: inherit; color: var(--texte); width: 100%; background: var(--carte-2); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 10px 14px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-doux); }
textarea { resize: vertical; min-height: 90px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--texte-2) 50%), linear-gradient(135deg, var(--texte-2) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.notifications { position: fixed; right: 20px; bottom: 20px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
.notification { background: var(--carte-3); border: 1px solid var(--bord-fort); border-left: 3px solid var(--accent); border-radius: var(--rayon); padding: 12px 16px; box-shadow: var(--ombre); max-width: 400px; }
.notification.erreur { border-left-color: var(--rouge); }
.pdrtec-dialog .liste-exports { margin: 4px 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: .86rem; color: var(--texte-2); }
.pdrtec-dialog .liste-exports b { color: var(--accent); }
.pdrtec-dialog .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.pdrtec-dialog label.btn { display: inline-flex; align-items: center; }
__CSS__
</style>
